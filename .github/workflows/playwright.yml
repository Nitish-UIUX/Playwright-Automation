
name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 5: Execute tests
      - name: Run Playwright tests
        run: npx playwright test

      # Step 6: Upload test report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


# Command / setting	Purpose
# on: push	Runs workflow after a push
# pull_request	Runs workflow for pull requests
# ubuntu-latest	Uses a GitHub-hosted Ubuntu machine
# actions/checkout@v4	Downloads your repository code
# actions/setup-node@v4	Installs Node.js
# npm ci	Installs dependencies from the lock file
# npx playwright install --with-deps	Installs browsers and system dependencies
# npx playwright test	Executes Playwright tests
# upload-artifact@v4	Saves the HTML report as an artifact